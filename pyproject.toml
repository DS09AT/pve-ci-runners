[project]
name = "pve-ci-runners"
version = "0.3.1"
description = "Run every GitHub Actions job in a fresh Proxmox VE virtual machine with a copy-on-write cache."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: No Input/Output (Daemon)",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Source = "https://github.com/DS09AT/pve-ci-runners"
Issues = "https://github.com/DS09AT/pve-ci-runners/issues"

[project.scripts]
pve-ci-runners = "pve_ci_runners.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pve_ci_runners"]

[dependency-groups]
dev = [
  "mccabe>=0.7.0",
  "mypy>=1.18",
  "pytest>=8.4",
  "pytest-cov>=7.0",
  "ruff>=0.14",
]

[tool.ruff]
preview = true
target-version = "py313"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
explicit-preview-rules = false
select = [
  "E", "F", "W", "I", "B", "UP", "SIM", "PL", "RUF", "ANN", "ARG", "C4", "DTZ",
  "ERA", "FBT", "ICN", "ISC", "PIE", "PT", "Q", "RET", "T20", "TC", "TRY",
  "S", "BLE", "LOG", "G", "PERF", "PTH", "SLF", "EM", "N", "INP", "FURB",
  "TID", "RSE", "D", "C90",
]
# Messages stay at the raise site (EM101/EM102): one place to read what failed and why.
# Rule codes are kept in selectors (RUF201): they match the codes in noqa comments and ruff output.
ignore = ["ANN401", "TRY003", "D203", "D213", "D105", "D107", "EM101", "EM102", "RUF105", "RUF201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 6
max-positional-args = 4
max-branches = 10
max-statements = 40
max-public-methods = 12
max-locals = 12
max-returns = 4
max-nested-blocks = 3
max-bool-expr = 4

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# The adapters exist to run fixed host tools; every call passes an argument list, never a shell.
"src/pve_ci_runners/proc.py" = ["S404", "S603"]
# The hypervisor port mirrors one qm/pvesh operation per method; splitting it would only scatter them.
"src/pve_ci_runners/pve.py" = ["PLR0904"]
"src/pve_ci_runners/ports.py" = ["PLR0904"]
# One typed reader method per value kind keeps every schema rule in one place.
"src/pve_ci_runners/config_reader.py" = ["PLR0904"]
"src/pve_ci_runners/cli.py" = ["T20"]
# Development scripts run from a checkout, not as an installed package, and report on standard output.
"scripts/**" = ["INP001", "T20"]
# Tests use fakes with unused parameters, seeded randomness, real bash calls and compact assertions.
"tests/**" = [
  "S101", "D", "PLR2004", "PLR6301", "ANN", "SLF001", "FBT001", "FBT002", "FBT003", "INP001", "S105", "S106",
  "S108", "S311", "S404", "S603", "S607", "ARG002", "PT018", "RUF031", "PLC0415", "PLR0904", "PLR0913", "PLR0917",
  "PLR6104", "RET501", "PLR1711",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["pve_ci_runners"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config -m 'not zfs'"
markers = ["zfs: needs root and a working ZFS kernel module"]

[tool.coverage.run]
branch = true
source = ["pve_ci_runners"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.codespell]
skip = "*.lock,.git,.venv"
# nftables (iif) and GnuPG (fpr) keywords.
ignore-words-list = "iif,fpr"

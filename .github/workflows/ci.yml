name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

# GitHub-hosted runners only: this repository is public, so a pull request from a fork must never run
# on self-hosted infrastructure. The image is pinned so a runner-image switch cannot change results.
jobs:
  checks:
    name: Lint, types and static analysis
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: Sync the development environment
        run: uv sync --locked --python 3.13
      - name: Ruff
        run: |
          uv run ruff check
          uv run ruff format --check
      - name: mypy
        run: uv run mypy
      - name: Pre-commit hooks
        env:
          SKIP: pytest,quality-gate,mypy
        run: uvx --from 'pre-commit==4.3.0' pre-commit run --all-files --show-diff-on-failure

  tests:
    name: Unit tests
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: Sync the development environment
        run: uv sync --locked --python 3.13
      - name: pytest with branch coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=json
      - name: Coverage, complexity and CRAP limits
        run: uv run python scripts/check_quality.py coverage.json

  zfs:
    name: ZFS cache backend on a real pool
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: Install ZFS
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q zfsutils-linux
          sudo modprobe zfs
      - name: Sync the development environment
        run: uv sync --locked --python 3.13
      - name: pytest -m zfs as root
        env:
          PVE_CI_REQUIRE_ZFS: "1"
        run: sudo -E env "PATH=$PATH" .venv/bin/pytest -m zfs -v

  package:
    name: Debian package
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build twice and compare the bytes
        run: |
          packaging/build-deb.sh
          cp dist/SHA256SUMS first.sums
          rm -rf dist
          packaging/build-deb.sh
          diff first.sums dist/SHA256SUMS
      - name: Install on Debian 13
        # The Proxmox packages are not in Debian; the test proves the package installs and runs.
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" \
            debian@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6 bash -euc '
              apt-get update -qq
              apt-get install -y -qq python3 >/dev/null
              dpkg --ignore-depends=qemu-server,pve-manager -i /dist/*.deb
              pve-ci-runners version
              pve-ci-runners -c /usr/share/doc/pve-ci-runners/config.example.toml config check
              if pve-ci-runners -c /nonexistent.toml config check; then exit 1; fi
              test "$(stat -c %a /etc/pve-ci-runners)" = 700
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: dist/
          retention-days: 14

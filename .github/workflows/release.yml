name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

# The tests install third-party development tools, so they run in a job without write access; the job
# that can sign and publish runs only first-party build steps on the system Python.
jobs:
  test:
    name: Tests
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: Sync the development environment
        run: uv sync --locked --python 3.13
      - name: pytest
        run: uv run pytest -q

  release:
    name: Build, attest and publish
    needs: test
    runs-on: ubuntu-26.04
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag names the package version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Build
        run: packaging/build-deb.sh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.deb
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
